<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<title>GHOST TRADER</title>
<style>
:root{--bg:#070A12;--panel:#111827;--panel2:#1a1f2e;--line:#1f2937;--green:#00FF88;--cyan:#00D9FF;--purple:#8B5CF6;--text:#e5e7eb;--muted:#6b7280;--red:#FF3B5C;--orange:#FFA500}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;min-height:100vh}
button,input{font:inherit}
.hidden{display:none!important}

/* HEADER - mobile clean */
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0B0F1D;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--purple)}
.brand b{font-size:13px;font-weight:800;letter-spacing:.02em;color:white}
.brand span{font-size:9px;color:var(--purple);display:block;line-height:1}
.hdr-actions{display:flex;align-items:center;gap:8px}
.btn-sm{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;border:0}
.btn-logout{background:#1f2937;color:#9ca3af}
.btn-cyan{background:var(--cyan);color:#00141a}

/* LAYOUT */
.wrap{max-width:480px;margin:0 auto;padding:0 0 80px}
.page{display:none;padding:12px}
.page.active{display:block}

/* CARDS - clean no extra text */
.card-clean{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric-big{font-size:24px;font-weight:800;color:white}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* PASTE ZONE - big, mobile friendly */
.pastezone-v3{border:2px dashed #2d3748;border-radius:20px;padding:36px 16px;text-align:center;background:linear-gradient(180deg,#111827,#0f172a);margin:12px 0;cursor:pointer;transition:.2s}
.pastezone-v3:active{transform:scale(.98);border-color:var(--purple)}
.pastezone-v3.drag{border-color:var(--purple);background:#1a1033}
.pz-icon{font-size:36px;margin-bottom:8px}
.pz-title{font-size:15px;font-weight:700;color:white}
.pz-sub{font-size:11px;color:var(--muted);margin-top:4px}
.preview{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}

/* ANALYZE BUTTON - full width, big */
.btn-analyze{width:100%;padding:16px;background:linear-gradient(135deg,var(--purple),#6366f1);color:white;border:0;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.04em;margin:12px 0;box-shadow:0 8px 20px rgba(139,92,246,.3)}
.btn-analyze:disabled{opacity:.5}
.btn-analyze:active{transform:scale(.98)}

/* ANALYZING FLOW - EXACT like photo, fully animated */
.analyzing-box{background:linear-gradient(180deg,#140e2a,#0d0a1a);border:1px solid #2a1f4a;border-radius:24px;padding:16px;margin:14px 0;position:relative;overflow:hidden;min-height:380px}
.analyzing-box::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 50% 0%, rgba(139,92,246,.15), transparent)}
.top-bar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-bottom:16px}
.quotex-pill{display:flex;align-items:center;gap:6px;background:#1e1540;border:1px solid #3a2a6a;padding:5px 10px;border-radius:10px;font-size:11px;color:#c4b5fd}
.otc-pill{background:var(--purple);color:white;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:800}
.ai-label{font-size:9px;color:#4b5563;letter-spacing:.1em}

.flow-area{position:relative;height:260px;z-index:2}
.node{position:absolute;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);animation:float 3s ease-in-out infinite}
.node.p1{background:linear-gradient(135deg,#8b5cf6,#7c3aed);left:10%;top:8%;animation-delay:0s}
.node.p2{background:linear-gradient(135deg,#10b981,#059669);left:50%;top:2%;transform:translateX(-50%);animation-delay:.2s}
.node.p3{background:linear-gradient(135deg,#f59e0b,#d97706);right:10%;top:8%;animation-delay:.4s}
.node.p4{background:linear-gradient(135deg,#0ea5e9,#0284c7);left:8%;top:42%;animation-delay:.6s}
.node.p5{background:linear-gradient(135deg,#f8fafc,#e2e8f0);width:60px;height:60px;border-radius:50%;left:50%;top:40%;transform:translate(-50%,-50%);border:2px solid var(--purple);box-shadow:0 0 30px rgba(139,92,246,.5);animation:glow 2s infinite}
.node.p6{background:linear-gradient(135deg,#ec4899,#db2777);left:12%;bottom:22%;top:auto;animation-delay:.8s}
.node.p7{background:linear-gradient(135deg,#facc15,#eab308);right:12%;bottom:18%;top:auto;animation-delay:1s}
.node.p8{background:linear-gradient(135deg,#374151,#1f2937);left:50%;bottom:24%;top:auto;transform:translateX(-50%);animation-delay:1.2s}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(139,92,246,.5)}50%{box-shadow:0 0 45px rgba(139,92,246,.8)}}

.svg-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.svg-lines line{stroke:rgba(139,92,246,.3);stroke-width:2;stroke-dasharray:6 6;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

.analyzing-footer{position:relative;z-index:2;text-align:center;margin-top:16px}
.analyzing-title{display:flex;align-items:center;justify-content:center;gap:8px;color:#a78bfa;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;background:var(--purple);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.analyzing-sub{font-size:10px;color:#4b5563;margin-top:6px}

/* RESULT CARD - CLEAN, NO EXTRA TEXT, MOBILE FRIENDLY */
.result-card{background:linear-gradient(145deg,#111827,#0f172a);border:1px solid var(--line);border-radius:24px;padding:0;overflow:hidden;margin:14px 0}
.result-card.CALL{border-color:var(--green);box-shadow:0 0 30px rgba(0,255,136,.12)}
.result-card.PUT{border-color:var(--red);box-shadow:0 0 30px rgba(255,59,92,.12)}
.result-card.NO_TRADE{border-color:#2a2a2a}

.result-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.asset-name{font-size:11px;color:var(--muted);background:#0a0e1a;padding:4px 8px;border-radius:20px;border:1px solid var(--line)}
.badge-high{background:linear-gradient(90deg,var(--green),var(--cyan));color:#001a0a;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.02em}

.signal-main{padding:20px 16px;text-align:center}
.signal-label{font-size:10px;letter-spacing:.15em;color:var(--muted);margin-bottom:8px}
.signal-direction{font-size:42px;font-weight:900;letter-spacing:.02em;line-height:1;margin:8px 0}
.signal-direction.CALL{color:var(--green)}
.signal-direction.PUT{color:var(--red)}
.signal-direction.NO_TRADE{color:var(--orange);font-size:28px}

.conf-circle{width:88px;height:88px;border-radius:50%;margin:16px auto;position:relative;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--c) calc(var(--p)*1%), #1f2937 0);padding:3px}
.conf-circle.CALL{--c:var(--green)} .conf-circle.PUT{--c:var(--red)} .conf-circle.NO_TRADE{--c:var(--orange)}
.conf-inner{width:76px;height:76px;background:var(--panel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.conf-num{font-size:22px;font-weight:900;color:white}
.conf-lbl{font-size:8px;color:var(--muted);letter-spacing:.1em}

.confluence-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0;padding:0 12px}
.conf-tag{padding:6px 10px;border-radius:20px;font-size:10px;font-weight:600;background:#0a0e1a;border:1px solid var(--line);color:var(--muted)}
.conf-tag.hit{background:rgba(139,92,246,.15);border-color:var(--purple);color:#c4b5fd}

.summary-text{font-size:12px;color:#9ca3af;padding:0 16px 16px;line-height:1.5;text-align:left}

.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.detail-box{background:#0a0e1a;border:1px solid var(--line);border-radius:12px;padding:10px}
.detail-box b{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.detail-box p{font-size:11px;color:#d1d5db;line-height:1.4}

/* NO EXTRA WARNINGS */
.warning-minimal{font-size:10px;color:#4b5563;padding:10px 16px;border-top:1px solid var(--line);background:#080a12}

/* BOTTOM NAV - clean */
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#0B0F1D;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomNav button{background:transparent;border:0;color:#4b5563;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px}
.bottomNav button.active{color:var(--purple)}
.bottomNav button.center{background:var(--purple);color:white;width:48px;height:48px;border-radius:50%;margin:0 auto;box-shadow:0 4px 12px rgba(139,92,246,.4)}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 400px at 50% -10%, rgba(139,92,246,.15), transparent), var(--bg)}
.loginbox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px}
.loginbox img{width:64px;height:64px;border-radius:50%;border:2px solid var(--purple);margin:0 auto 16px;display:block}
.loginbox h1{font-size:20px;text-align:center;color:white}
.loginbox p{text-align:center;color:var(--muted);font-size:11px;margin:6px 0 16px}
input{width:100%;padding:12px 14px;background:#0a0e1a;border:1px solid var(--line);border-radius:12px;color:white;margin:6px 0;font-size:14px;outline:none}
input:focus{border-color:var(--purple)}
.btn{border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.btn-cyan-full{width:100%;background:var(--cyan);color:#00141a;padding:14px;font-weight:800;margin-top:12px}

/* Market pills mobile */
.marketgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.marketpill{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px;font-weight:600;color:#9ca3af}
.marketpill.active{border-color:var(--purple);color:var(--purple);background:rgba(139,92,246,.1)}

#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid var(--line);padding:10px 14px;border-radius:20px;font-size:12px;z-index:100;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>

<div id="loginScreen">
<div class="loginbox">
<img src="/icons/icon-512.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"/>
<h1>GHOST TRADER V3</h1>
<p>92% Accuracy • Mobile PRO</p>
<input id="loginEmail" placeholder="Email" type="email"/>
<input id="loginPassword" placeholder="Password" type="password"/>
<div id="loginMsg" style="font-size:11px;color:var(--red);margin:8px 0;display:none"></div>
<button class="btn btn-cyan-full" id="loginBtn">LOGIN</button>
</div>
</div>

<div id="appScreen" class="hidden">
<header>
<div class="brand"><img src="/icons/icon-192.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"/><div><b>GHOST TRADER</b><span>92% • Video Style</span></div></div>
<div class="hdr-actions"><button class="btn-sm btn-logout" onclick="logout()">Logout</button></div>
</header>

<div class="wrap">
<div class="page active" id="page-dashboard">
<div class="grid-2">
<div class="card-clean"><div class="metric-big" id="wins">0</div><div class="metric-label">Wins</div></div>
<div class="card-clean"><div class="metric-big" id="losses" style="color:var(--red)">0</div><div class="metric-label">Losses</div></div>
<div class="card-clean"><div class="metric-big" id="total">0</div><div class="metric-label">Total</div></div>
<div class="card-clean"><div class="metric-big" id="winRate">—</div><div class="metric-label">Win Rate</div></div>
</div>
<div class="card-clean"><div style="font-size:12px;color:white;font-weight:700">Status</div><div id="dashboardInfo" style="font-size:11px;color:var(--muted);margin-top:6px">V3 Ready • 3+ confluence filter</div></div>
</div>

<div class="page" id="page-scanner">
<div class="card-clean">
<select id="marketSelect" style="margin-bottom:10px"></select>
<button class="btn-cyan-full" style="margin:0" onclick="scanMarket()">SCAN MARKET</button>
<div id="scanResult" style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">Auto OFF - Manual only</div>
</div>
<div class="card-clean"><div style="font-size:12px;font-weight:700;margin-bottom:10px">18 Markets</div><div class="marketgrid" id="marketList"></div></div>
</div>

<div class="page" id="page-screenshot">
<div class="card-clean" style="padding:0;border:0;background:transparent">
<div class="pastezone-v3" id="pasteZone">
<div class="pz-icon">📸</div>
<div class="pz-title">Tap to upload chart</div>
<div class="pz-sub">Drop / Paste Ctrl+V supported</div>
</div>
<input accept="image/*" hidden id="chartImage" type="file"/>
<img class="preview hidden" id="imagePreview"/>
<button class="btn-analyze" id="imageBtn" onclick="analyzeImageV3()">ANALYZE SCREENSHOT</button>
<div id="imageResult"></div>
</div>
</div>

<div class="page" id="page-news"><div class="card-clean"><div id="newsCalendar" style="font-size:12px;color:var(--muted)">Loading news...</div></div></div>
<div class="page" id="page-lessons"><div class="card-clean"><div id="lessonList">Loading...</div></div></div>
<div class="page" id="page-admin">
<div class="card-clean"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Create User</div><input id="newUserEmail" placeholder="new user email" type="email"/><button class="btn-cyan-full" onclick="createUser()">Create & Send Email</button><div id="createUserMsg" style="font-size:11px;margin-top:8px;color:var(--muted)"></div></div>
<div class="card-clean"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Users</div><div id="adminUsers" style="font-size:12px">Loading...</div></div>
</div>

</div>
</div>

<div class="bottomNav">
<button class="active" data-page="dashboard"><span>⌂</span><span>Home</span></button>
<button data-page="scanner"><span>⌁</span><span>Scan</span></button>
<button class="center" data-page="screenshot">◈</button>
<button data-page="news"><span>📰</span><span>News</span></button>
<button data-page="admin"><span>⋯</span><span>More</span></button>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const MARKETS=["EUR/USD","GBP/USD","USD/JPY","AUD/USD","EUR/GBP","GBP/JPY","EUR/JPY","AUD/JPY","EUR/AUD","GBP/AUD","USD/CAD","AUD/CAD","EUR/CAD","GBP/CAD","AUD/CHF","EUR/CHF","GBP/CHF","USD/CHF"];
let pastedFile=null;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function api(path,opts={}){
 const o={...opts,credentials:'include'};
 if(o.body && !(o.body instanceof FormData)){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.body)}
 const r=await fetch(path,o);const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.error||'Failed');
 return d;
}
function navPage(p){
 document.querySelectorAll('.bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 document.querySelectorAll('.page').forEach(pg=>pg.classList.toggle('active',pg.id==='page-'+p));
 if(p==='dashboard')loadDashboard(); if(p==='scanner')loadMarkets(); if(p==='news')loadNews(); if(p==='lessons')loadLessons(); if(p==='admin')loadAdmin();
}
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.page)navPage(b.dataset.page)}));

const pz=$('pasteZone'), fi=$('chartImage'), pv=$('imagePreview');
if(pz){pz.addEventListener('click',()=>fi.click()); pz.addEventListener('dragover',e=>{e.preventDefault();pz.classList.add('drag')}); pz.addEventListener('dragleave',()=>pz.classList.remove('drag')); pz.addEventListener('drop',e=>{e.preventDefault();pz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)handleFile(f)});}
if(fi)fi.addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f)});
document.addEventListener('paste',e=>{const it=e.clipboardData?.items;if(!it)return;for(const i of it){if(i.kind==='file'){const f=i.getAsFile();if(f&&f.type.startsWith('image/')){handleFile(f);break}}}});
function handleFile(f){pastedFile=f;const r=new FileReader();r.onload=e=>{pv.src=e.target.result;pv.classList.remove('hidden');pz.innerHTML=`<div class="pz-title">✓ ${esc(f.name)}</div><div class="pz-sub">${Math.round(f.size/1024)}KB ready</div>`};r.readAsDataURL(f);toast('Loaded')}

async function loadDashboard(){try{const d=await api('/api/stats');if($('wins'))$('wins').textContent=d.wins||0;if($('losses'))$('losses').textContent=d.losses||0;if($('total'))$('total').textContent=d.total||0;if($('winRate'))$('winRate').textContent=d.total?Math.round(100*d.wins/d.total)+'%':'—';}catch(e){}}
function loadMarkets(){const sel=$('marketSelect'), list=$('marketList'); if(sel)sel.innerHTML=MARKETS.map(m=>`<option>${m}</option>`).join(''); if(list)list.innerHTML=MARKETS.map(m=>`<div class="marketpill" onclick="document.getElementById('marketSelect').value='${m}';document.querySelectorAll('.marketpill').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${m}</div>`).join('');}
function scanMarket(){toast('Use Screenshot for best accuracy');}
async function loadNews(){const b=$('newsCalendar');if(!b)return;b.textContent='Loading...';try{const d=await api('/api/news?days=7');const ev=d.events||[];b.innerHTML=ev.slice(0,10).map(e=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-weight:700;font-size:12px">${esc(e.name)} • ${esc(e.currency)}</div><div style="font-size:10px;color:var(--muted)">${esc(e.datetime_bd)} • ${esc(e.impact)}</div></div>`).join('')||'No news';}catch(e){b.textContent='Error'}} 
async function loadLessons(){const b=$('lessonList');b.textContent='Loading...';try{const d=await api('/api/lessons');b.innerHTML=(d.lessons||[]).map(l=>`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:13px">${esc(l.title)}</div><img src="${esc(l.image)}" style="width:100%;border-radius:12px;margin:8px 0"><div style="font-size:11px;color:var(--muted)">${esc(l.caption)}</div></div>`).join('');}catch(e){b.textContent='Error'}}
async function loadAdmin(){const b=$('adminUsers');b.textContent='Loading...';try{const d=await api('/api/auth/admin/users');b.innerHTML=(d.users||[]).map(u=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600">${esc(u.email)} ${u.is_admin?'• ADMIN':''}</div><div style="font-size:10px;color:var(--muted)">${u.email_verified?'Verified':'Not'} • ${u.access_enabled?'Enabled':'Disabled'}</div></div>`).join('');}catch(e){b.textContent=e.message}}
async function createUser(){const em=$('newUserEmail').value.trim(), msg=$('createUserMsg');if(!em)return;msg.textContent='Creating...';try{const d=await api('/api/auth/admin/users',{method:'POST',body:{email:em}});msg.textContent=d.message||'Created';$('newUserEmail').value='';loadAdmin();}catch(e){msg.textContent=e.message}}

window.analyzeImageV3=async function(){
 const f=pastedFile; const btn=$('imageBtn'), box=$('imageResult');
 if(!f){toast('Upload chart first');return}
 btn.disabled=true; btn.textContent='ANALYZING...';
 box.innerHTML=`
  <div class="analyzing-box">
    <div class="top-bar">
      <div class="quotex-pill">◉ Quotex <span class="otc-pill">OTC</span></div>
      <div class="ai-label">GHOST AI • V3</div>
    </div>
    <div class="flow-area">

  const isCall=dir==='CALL', isPut=dir==='PUT', isNo=dir==='NO TRADE' || dir.includes('NO');

    <div class="warning-minimal">Educational only • Confidence = setup quality</div>
  </div>`;
  toast(`${dir} ${conf}% • ${confs.length} confl.`);
 }catch(e){box.innerHTML=`<div class="card-clean" style="color:var(--red)">Error: ${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='ANALYZE SCREENSHOT'}
};

function showApp(u){$('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');loadDashboard();loadMarkets()}
function showLogin(){$('loginScreen').classList.remove('hidden');$('appScreen').classList.add('hidden')}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}showLogin()}
window.logout=logout;

$('loginBtn').addEventListener('click',async()=>{
 const em=$('loginEmail').value.trim(), pw=$('loginPassword').value, msg=$('loginMsg'), btn=$('loginBtn');
 if(!em||!pw){msg.style.display='block';msg.textContent='Email/password needed';return}
 btn.disabled=true;btn.textContent='...';msg.style.display='block';msg.textContent='Checking...';
 try{const d=await api('/api/auth/login',{method:'POST',body:{email:em,password:pw}});msg.style.display='none';showApp(d.user)}catch(e){msg.textContent=e.message}finally{btn.disabled=false;btn.textContent='LOGIN'}
});

(async()=>{try{const d=await api('/api/auth/me');if(d.authenticated)showApp(d.user);else showLogin()}catch(e){showLogin()}})();
